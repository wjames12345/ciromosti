<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ciro Mosti — Photographer · v10</title>
<style>
:root{
  --ground:#F5F6F8;
  --ink:#000000;
  --meta:#9A9DA4;
  --sheet:#E7E9ED;
  --hair:rgba(0,0,0,.14);
  --m:clamp(16px,2.2vw,34px);
  --gap:clamp(40px,9vh,120px);
  --fs-nav:clamp(.95rem,1.45vw,1.4rem);
  --fs-cap:.7rem;
  --fs-ctr:.68rem;
  --ff:"Helvetica Now Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ff-t:"Helvetica Now Text","Helvetica Neue",Helvetica,Arial,sans-serif;
}
/* ground options — press B to cycle */
body[data-g="1"]{--ground:#F5F6F8;--ink:#000;--meta:#9A9DA4;--sheet:#E7E9ED;--hair:rgba(0,0,0,.14)}
body[data-g="2"]{--ground:#FFFFFF;--ink:#000;--meta:#9C9FA6;--sheet:#F1F2F5;--hair:rgba(0,0,0,.13)}
body[data-g="3"]{--ground:#EDEFF2;--ink:#000;--meta:#94979E;--sheet:#E1E4E9;--hair:rgba(0,0,0,.15)}
body[data-g="4"]{--ground:#0B0B0C;--ink:#FAFAFA;--meta:#75787E;--sheet:#141517;--hair:rgba(255,255,255,.16)}
body[data-g="4"] .pick[aria-pressed="true"]{background:#FAFAFA;border-color:#FAFAFA}
body[data-g="4"] .selbar{background:#FAFAFA;color:#0B0B0C}
body[data-g="4"] .submit{background:#FAFAFA;color:#0B0B0C}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--ground);color:var(--ink);font-family:var(--ff-t);
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
em{font-style:italic}
::selection{background:var(--ink);color:var(--ground)}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}

/* ---------- shared chrome ---------- */
.chrome{position:fixed;z-index:60;font-family:var(--ff);font-weight:700;
  font-size:var(--fs-ctr);letter-spacing:.12em;text-transform:uppercase}
.ch-tl{top:var(--m);left:var(--m)}
.ch-tr{top:var(--m);right:var(--m)}
.ch-tl,.ch-tr{transition:transform .18s ease}
body.hidtop .ch-tl,body.hidtop .ch-tr{transform:translateY(calc(-100% - var(--m) - 6px))}
.ch-bl{bottom:var(--m);left:var(--m);display:flex;gap:1.4em;align-items:baseline}
.ch-br{bottom:var(--m);right:var(--m);display:flex;gap:1.4em;align-items:baseline}
.ctr{font-variant-numeric:tabular-nums;letter-spacing:.14em}
.chrome button,.chrome a{text-transform:uppercase;letter-spacing:inherit}
.chrome button:hover,.chrome a:hover{opacity:.45}
.ch-bl,.ch-tl,.ch-tr,.ch-br{mix-blend-mode:difference;color:#fff}
body[data-g="4"] .ch-bl,body[data-g="4"] .ch-tl,
body[data-g="4"] .ch-tr,body[data-g="4"] .ch-br{mix-blend-mode:normal;color:var(--ink)}
.index .ch-tr,.menu .ch-tr{mix-blend-mode:normal;color:var(--ink)}
.chrome .mark{font-weight:900;letter-spacing:.02em;font-size:.78rem}

/* ---------- landing ---------- */
.hero{height:100vh;height:100svh;position:relative}
.heroblock{position:absolute;left:var(--m);top:33%;right:var(--m)}
.word{font-family:var(--ff);font-weight:900;
  letter-spacing:-.045em;line-height:.82;font-size:clamp(2.4rem,10vw,10.5rem);
  text-transform:uppercase;white-space:nowrap}
.avail{margin-top:1.6em;font-family:var(--ff-t);font-size:var(--fs-cap);letter-spacing:.09em;
  text-transform:uppercase;color:var(--meta);font-weight:400;line-height:1.9}
.photog{font-family:var(--ff);font-weight:700;font-size:var(--fs-nav);
  letter-spacing:.14em;text-transform:uppercase}
.nav{position:absolute;top:52%;right:var(--m);
  font-family:var(--ff);font-weight:700;font-size:var(--fs-nav);
  letter-spacing:.045em;text-transform:uppercase;text-align:right;min-width:14em}
.nav>li{list-style:none}
.nav .row{display:flex;justify-content:flex-end;gap:.7em;align-items:baseline;
  padding:.22em 0;cursor:pointer}
.nav .row:hover{opacity:.45}
.nav .pm{width:.9em;text-align:right;font-weight:400}
.drop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .18s ease}
.drop>div{overflow:hidden}
.navitem.open .drop{grid-template-rows:1fr}
.drop a{display:block;font-weight:400;letter-spacing:.04em;padding:.14em 0;
  font-size:calc(var(--fs-nav) * .82);color:var(--meta);line-height:1.35}
.drop.long .inner{display:grid;grid-template-columns:repeat(3,auto);
  gap:1.3em 2.6em;justify-content:end;padding-top:.7em}
.drop.long a{font-size:calc(var(--fs-nav) * .56);letter-spacing:.055em;padding:.04em 0;
  line-height:1.62}
.drop.long .cityhead{display:block;font-size:calc(var(--fs-nav) * .56);letter-spacing:.15em;
  font-weight:700;color:var(--ink);line-height:1.62;padding-bottom:.35em}
.drop .mailto{font-size:calc(var(--fs-nav) * .78);color:var(--ink);
  font-family:var(--ff-t);letter-spacing:.02em;text-transform:none}
.drop a:hover{color:var(--ink)}
.drop .inner{padding:.35em 0 .7em}
.cue{position:absolute;left:50%;transform:translateX(-50%);bottom:clamp(20px,4.5vh,44px);
  display:grid;justify-items:center;gap:.85em;color:inherit}
.cue .ring{width:38px;height:38px;border:1px solid var(--ink);border-radius:50%;
  display:grid;place-items:center;transition:transform .14s ease}
.cue:hover .ring{transform:translateY(2px)}
.cue .lbl{font-family:var(--ff);font-weight:700;font-size:var(--fs-ctr);
  letter-spacing:.14em;text-transform:uppercase}

/* ---------- frames ---------- */
.frames{padding:0 var(--m) 22vh}
.frame{margin:0 auto var(--gap);display:block}
.frame:first-child{margin-top:0}
.frame img{width:100%}
.frame.ls{width:min(100%,calc(88vh * var(--ar)))}
.frame.pt{width:min(48vw,calc(88vh * var(--ar)))}
.frame.sq{width:min(60vw,calc(88vh * var(--ar)))}
.cap{display:flex;gap:.85em;align-items:flex-start;max-width:100%;
  margin-top:.85em;font-size:var(--fs-cap);letter-spacing:.055em;color:var(--meta);
  text-transform:uppercase;line-height:1.7}
.pick{flex:0 0 auto;width:13px;height:13px;border:1px solid var(--meta);
  margin-top:.28em;position:relative}
.pick:hover{border-color:var(--ink)}
.pick[aria-pressed="true"]{background:#000;border-color:#000}
.cap .who{color:var(--ink)}

/* project head */
.phead{padding:calc(var(--m) * 4) var(--m) calc(var(--m) * 2.2);
  display:flex;justify-content:space-between;align-items:baseline;gap:2em;flex-wrap:wrap}
.phead h1{font-family:var(--ff);font-weight:900;letter-spacing:-.02em;
  font-size:clamp(1.5rem,3.4vw,2.6rem);text-transform:uppercase;line-height:1}
.phead .pm-meta{font-size:var(--fs-cap);letter-spacing:.09em;text-transform:uppercase;
  color:var(--meta)}

/* sheet density */
body.sheet .frames{display:grid;grid-template-columns:repeat(3,1fr);
  gap:calc(var(--m) * 1.4);padding-bottom:22vh}
body.sheet .frame{margin:0}
body.sheet .frame{width:100%!important}
body.sheet .cap{font-size:.62rem}

/* ---------- index overlay ---------- */
.index{position:fixed;inset:0;z-index:90;background:var(--sheet);
  padding:calc(var(--m) * 3.6) var(--m) var(--m);overflow-y:auto;
  transform:scale(.985);opacity:0;pointer-events:none;
  transition:opacity .16s cubic-bezier(.2,0,0,1),transform .16s cubic-bezier(.2,0,0,1)}
.index.on{opacity:1;transform:none;pointer-events:auto}
.axis{display:flex;gap:1.6em;font-family:var(--ff);font-weight:700;
  font-size:var(--fs-ctr);letter-spacing:.12em;text-transform:uppercase;
  margin-bottom:calc(var(--m) * 1.6)}
.axis button{color:var(--meta)}
.axis button[aria-pressed="true"]{color:var(--ink)}
.axis button:hover{color:var(--ink)}
.igroup{margin-bottom:calc(var(--m) * 1.8)}
.igroup h2{font-family:var(--ff);font-weight:700;font-size:var(--fs-ctr);
  letter-spacing:.14em;text-transform:uppercase;color:var(--meta);
  padding-bottom:.7em;margin-bottom:1em;border-bottom:1px solid var(--hair)}
.igrid{display:grid;grid-template-columns:repeat(8,1fr);gap:calc(var(--m) * .6)}
.ithumb{display:block;position:relative;background:rgba(0,0,0,.05)}
.ithumb img{width:100%;aspect-ratio:1;object-fit:cover}
.ithumb:hover img{opacity:.62}
.ithumb .t{display:block;margin-top:.55em;font-size:.58rem;font-variant-numeric:tabular-nums;
  letter-spacing:.12em;text-transform:uppercase;color:var(--meta)}
.ithumb:hover .t{color:var(--ink)}

/* ---------- menu overlay ---------- */
.menu{position:fixed;inset:0;z-index:80;background:var(--ground);
  display:grid;align-content:center;padding:var(--m);
  opacity:0;pointer-events:none;transition:opacity .14s ease}
.menu.on{opacity:1;pointer-events:auto}
.menu a{font-family:var(--ff);font-weight:900;text-transform:uppercase;
  letter-spacing:-.02em;font-size:clamp(1.6rem,5vw,3rem);line-height:1.18}
.menu a:hover{opacity:.4}
.menu .grp{font-size:var(--fs-ctr);letter-spacing:.14em;color:var(--meta);
  font-weight:700;margin:1.4em 0 .5em}
.menu .sm{font-size:clamp(1rem,2.2vw,1.3rem);font-weight:700}

/* ---------- selection bar ---------- */
.selbar{position:fixed;right:var(--m);bottom:var(--m);z-index:70;
  background:var(--ink);color:var(--ground);display:flex;gap:1.4em;align-items:center;
  padding:.85em 1.15em;font-family:var(--ff);font-weight:700;font-size:var(--fs-ctr);
  letter-spacing:.12em;text-transform:uppercase;
  transform:translateY(calc(100% + var(--m) + 12px));
  transition:transform .16s cubic-bezier(.2,0,0,1)}
.selbar.on{transform:none}
.selbar button:hover{opacity:.6}
.selbar .n{font-variant-numeric:tabular-nums}

/* ---------- generic page ---------- */
.page{padding:calc(var(--m) * 5) var(--m) 18vh;max-width:1500px;margin:0 auto}
.page h1{font-family:var(--ff);font-weight:900;letter-spacing:-.025em;
  font-size:clamp(1.7rem,4.4vw,3.2rem);text-transform:uppercase;line-height:.95;
  margin-bottom:1.2em}
.lede{font-size:clamp(1.05rem,2vw,1.5rem);line-height:1.4;max-width:26em;
  letter-spacing:-.01em}
.eyebrow{font-family:var(--ff);font-weight:700;font-size:var(--fs-ctr);
  letter-spacing:.14em;text-transform:uppercase;color:var(--meta);
  padding-bottom:.7em;border-bottom:1px solid var(--hair);margin:3.4em 0 1.2em}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--m) 4vw}
.svc{font-size:.9rem;line-height:2}
.svc a{border-bottom:1px solid var(--hair)}
.svc a:hover{border-color:var(--ink)}
.svc .big{font-size:1.4rem;letter-spacing:-.01em}

/* ---------- agencies map ---------- */
.mapwrap{position:relative;margin-top:2em}
.mapwrap svg{width:100%;height:auto;display:block}
.mapwrap svg path{fill:none;stroke:var(--ink);stroke-width:1.1;
  stroke-opacity:.13;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.pin{position:absolute;width:5px;height:5px;background:var(--ink);border-radius:50%;
  transform:translate(-50%,-50%)}
.pin::after{content:"";position:absolute;inset:-7px;border:1px solid var(--ink);
  border-radius:50%;opacity:.3}
.blk{position:absolute;width:17em;font-size:.68rem;line-height:1.9;
  letter-spacing:.03em;text-transform:uppercase}
.blk h3{font-family:var(--ff);font-weight:900;font-size:.86rem;letter-spacing:.02em;
  padding-bottom:.5em;margin-bottom:.6em;border-bottom:1px solid var(--hair)}
.blk li{list-style:none;color:var(--meta)}
.blk li:hover{color:var(--ink)}
.lead{position:absolute;background:var(--ink);opacity:.22}
.mapwrap{max-width:1120px}
.maplist{display:none}

/* ---------- form ---------- */
.form{max-width:34em;margin-top:1.4em}
.f-row{display:grid;grid-template-columns:8.5em 1fr;gap:1em;align-items:center;
  padding:.9em 0;border-bottom:1px solid var(--hair)}
.f-row label{font-size:var(--fs-cap);letter-spacing:.1em;text-transform:uppercase;
  color:var(--meta)}
.f-row input,.f-row select,.f-row textarea{width:100%;background:none;border:0;
  font:inherit;font-size:.95rem;color:var(--ink);padding:0;border-radius:0}
.f-row select{-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--meta) 50%),
                   linear-gradient(135deg,var(--meta) 50%,transparent 50%);
  background-position:calc(100% - 9px) .55em,calc(100% - 4px) .55em;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:1.6em}
.f-row textarea{resize:vertical;min-height:3.4em;line-height:1.5}
.f-row input::placeholder,.f-row textarea::placeholder{color:rgba(140,139,134,.6)}
.submit{margin-top:1.8em;background:var(--ink);color:var(--ground);
  padding:1em 2.2em;font-family:var(--ff);font-weight:700;font-size:var(--fs-ctr);
  letter-spacing:.14em;text-transform:uppercase}
.submit:hover{opacity:.82}
.note{font-size:var(--fs-cap);letter-spacing:.06em;color:var(--meta);margin-top:1.2em;
  text-transform:uppercase}

/* ---------- deliver ---------- */
.dgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--m)}
.dgrid img{width:100%;aspect-ratio:4/5;object-fit:cover}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .frame.pt{width:min(66vw,calc(84vh * var(--ar)))}
  .frame.sq{width:min(72vw,calc(84vh * var(--ar)))}
  .igrid{grid-template-columns:repeat(4,1fr)}
  body.sheet .frames{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:767px){
  :root{--gap:40px}
  .hero{height:100svh}
  .heroblock{top:26%}
  .word{font-size:clamp(2.1rem,11.5vw,4rem)}
  .nav{display:none}
  .ch-br{gap:1em}
  .avail{margin-top:1.6em}
  .frame.ls,.frame.pt,.frame.sq{width:100%}
  .cols{grid-template-columns:1fr}
  .igrid{grid-template-columns:repeat(2,1fr)}
  body.sheet .frames{grid-template-columns:1fr}
  .mapwrap .blk,.mapwrap .lead{display:none}
  .mapwrap .pin{width:4px;height:4px}
  .maplist{display:grid;gap:2.6em;margin-top:3em}
  .f-row{grid-template-columns:1fr;gap:.35em;align-items:start}
  .ch-bl{gap:1em}
  .selbar{left:var(--m);right:var(--m);justify-content:space-between}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}


/* ---------- CIRO MOSTI v3 refinements ---------- */
:root{
  --ground:#11110F;
  --ink:#F4F2ED;
  --meta:rgba(244,242,237,.54);
  --sheet:#11110F;
  --hair:rgba(244,242,237,.16);
  --edge:1cm;
  --m:clamp(16px,2.2vw,38px);
  --ff:"Helvetica Neue",Helvetica,Arial,sans-serif;
  --ff-t:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
html{background:#11110F;scroll-behavior:smooth}
body{
  background:#11110F;color:#F4F2ED;
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-weight:700;
}
em{font-style:normal}
.menu,.index{background:#11110F;color:#F4F2ED}
.index .ch-tr,.menu .ch-tr{color:#F4F2ED}
.drop a,.pm-meta,.eyebrow,.note,.blk li{color:var(--meta)}
.word,.photog,.nav,.chrome,.phead h1,.page h1,.blk h3{font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}

/* menu motion: slower, calmer, less twitchy */
.drop{transition:grid-template-rows .34s cubic-bezier(.22,1,.36,1)}
.nav .row{padding:.30em 0}
.nav .row:hover{opacity:.72}
.drop a{transition:opacity .18s ease,color .18s ease}
.drop a:hover{opacity:.72;color:#F4F2ED}

/* photographic layout */
.frames{padding:0 var(--edge) 18vh}
.frame{margin:0 auto clamp(54px,9vh,120px);position:relative}
.frame.ls,.frame.sq{width:100%}
.frame.pt{width:76vw;max-width:76vw}
.frame img{width:100%;height:auto}
.phead{padding-left:var(--edge);padding-right:var(--edge)}

/* desktop credits live on the image only */
.image-wrap{position:relative;width:100%}
.credit-overlay{
  position:absolute;inset:0;display:flex;align-items:flex-end;
  padding:clamp(14px,1.4vw,24px);
  color:#fff;background:linear-gradient(to top,rgba(0,0,0,.58),rgba(0,0,0,0) 42%);
  opacity:0;pointer-events:none;
  transition:opacity .24s ease;
}
.frame:hover .credit-overlay,.frame:focus-within .credit-overlay{opacity:1}
.credit-text{
  max-width:min(900px,88%);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  font-size:clamp(.64rem,.72vw,.78rem);line-height:1.45;letter-spacing:.045em;
  text-transform:uppercase;font-weight:700;text-shadow:0 1px 8px rgba(0,0,0,.35)
}
.mobile-credits,.mobile-credit-copy{display:none}
.cap{margin:0}

@media (max-width:767px){
  :root{--edge:12px;--gap:38px}
  .frames{padding-left:var(--edge);padding-right:var(--edge)}
  .frame.ls,.frame.pt,.frame.sq{width:100%;max-width:none}
  .credit-overlay{display:none}
  .mobile-credits{
    display:block;margin-top:.62rem;color:rgba(255,255,255,.48);
    font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:.64rem;
    line-height:1;letter-spacing:.12em;text-transform:uppercase;font-weight:700;
  }
  .mobile-credit-copy{
    display:block;max-height:0;overflow:hidden;opacity:0;margin:0;
    color:rgba(255,255,255,.58);font-size:.64rem;line-height:1.55;
    letter-spacing:.045em;text-transform:uppercase;
    transition:max-height .28s ease,opacity .22s ease,margin .28s ease;
  }
  .frame.credits-open .mobile-credit-copy{max-height:12rem;opacity:1;margin-top:.62rem}
}


/* ---------- archive wall ---------- */
.index{
  padding:clamp(62px,7vh,86px) 0 34px;
  overflow-y:auto;overflow-x:hidden;
}
.archive-wall{width:100%;overflow:hidden}
.archive-row{
  display:flex;align-items:flex-start;gap:clamp(10px,1.05vw,16px);
  width:max-content;margin:0 0 clamp(10px,1.05vw,16px);
  transform:translateX(var(--row-shift,0px));
}
.archive-thumb{display:block;flex:0 0 auto;background:transparent}
.archive-thumb img{
  height:clamp(132px,10.7vw,166px);width:auto;max-width:none;
  object-fit:contain;display:block;transition:opacity .22s ease;
}
.archive-thumb:hover img{opacity:.72}
.archive-close{
  width:28px;height:28px;display:grid;place-items:center;
}
.archive-close svg{width:14px;height:14px;display:block}
@media (max-width:767px){
  .index{padding-top:58px}
  .archive-row{gap:8px;margin-bottom:8px}
  .archive-thumb img{height:112px}
}


/* ---------- CIRO MOSTI v4 navigation / scroll refinements ---------- */
:root{
  --ground:#191816;
  --ink:#F2F0EB;
  --meta:rgba(242,240,235,.56);
  --sheet:#191816;
  --hair:rgba(242,240,235,.15);
}
html{background:var(--ground)}
body{background:var(--ground);color:var(--ink)}
.menu,.index{background:var(--ground);color:var(--ink)}

/* landing belongs to document flow: it leaves with the page as you scroll */
.hero{position:relative;z-index:1;background:var(--ground)}

/* remove all bottom-left chrome; page-two controls live bottom-right only */
.ch-bl{display:none!important}
.ch-br{gap:1.45em;mix-blend-mode:normal;color:var(--ink)}
.ch-br button{font-weight:700}

/* one calm, consistent interaction language for all landing navigation */
.nav{
  width:min(31rem,44vw);min-width:0;
}
.nav>li{position:relative}
.nav .row{
  width:100%;border:0;background:transparent;color:inherit;
  justify-content:flex-end;padding:.29em 0;
  text-align:right;font-family:var(--ff);font-weight:700;
  font-size:inherit;letter-spacing:inherit;text-transform:uppercase;
}
.nav .row:hover,.nav .row:focus-visible{opacity:.68}
.nav .row:focus-visible{outline:1px solid currentColor;outline-offset:4px}
.drop{transition:grid-template-rows .38s cubic-bezier(.22,1,.36,1)}
.drop .inner{
  display:grid;justify-items:end;gap:.06em;
  padding:.42em 0 .74em;
}
.drop a,.drop .nav-copy{
  display:block;padding:.08em 0;
  font-family:var(--ff-t);font-size:calc(var(--fs-nav) * .72);
  font-weight:400;line-height:1.42;letter-spacing:.025em;
  text-transform:none;color:var(--meta);text-align:right;
}
.drop a:hover,.drop a:focus-visible{color:var(--ink);opacity:1}
.drop.twocol .inner{
  grid-template-columns:repeat(2,minmax(0,1fr));
  column-gap:2.25em;row-gap:.08em;
  width:min(28rem,44vw);margin-left:auto;
}
.drop.twocol a{width:100%;white-space:nowrap}

/* ==========================================================================\n   FINAL — archival minimalist portfolio direction\n   ========================================================================== */

.eyebrow,.svc,.note,.f-row,.submit,.mobile-credits,.mobile-credit-copy{

:root{

/* ---------------- project PDF export ---------------- */
function stripTags(html){
  return String(html||"").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
}
function pdfImageFormat(dataUri){
  if(dataUri.startsWith("data:image/png")) return "PNG";
  if(dataUri.startsWith("data:image/webp")) return "WEBP";
  return "JPEG";
}
async function buildProjectPDF(slug){
  const p = PROJECTS.find(x=>x.slug===slug);
  if(!p || !window.jspdf) return null;
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:"pt",format:"a4"});
  const pageW = doc.internal.pageSize.getWidth();
  const pageH = doc.internal.pageSize.getHeight();
  const margin = 42;
  doc.setFont("helvetica","bold"); doc.setFontSize(20); doc.text(p.title, margin, margin);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(170);
  doc.text("Ciro Mosti \u2014 Photographer", pageW-margin, margin, {align:"right"});
  for(const f of p.frames){
    const meta = IMGMETA[f.src];
    const img = await loadPdfImage(src(f.src));
    const availW = pageW - margin*2;
    const availH = pageH - margin*2 - 20;
    const ratio = meta.w/meta.h;
    let w = availW, h = w/ratio;
    if(h > availH){ h = availH; w = h*ratio; }
    doc.addPage();
    doc.addImage(img, "JPEG", margin + (availW-w)/2, margin, w, h);
  }
  return doc;
}
async function downloadProjectPDF(slug, btn){
  /* Each project PDF is pre-built at publish time and served as a static file,
     so downloads are instant regardless of how many photographs a project has. */
  const a=document.createElement("a");
  a.href="assets/pdf/"+slug+".pdf";
  a.download=slug+".pdf";
  document.body.appendChild(a); a.click(); a.remove();
}

/* counter via intersection */
let io;
function observe(){
  if(io) io.disconnect();
  const frames = [...document.querySelectorAll(".frame")];
  if(!frames.length){ const c=$("#ctr"); if(c) c.textContent = `${pad(0)} / ${pad(TOTAL)}`; return; }
  io = new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(e.isIntersecting){
        counterIdx = frames.indexOf(e.target)+1;
        const c=$("#ctr"); if(c) c.textContent = `${pad(counterIdx)} / ${pad(frames.length)}`;
      }
    });
  },{rootMargin:"-45% 0px -45% 0px"});
  frames.forEach(f=>io.observe(f));
}

document.addEventListener("click", e=>{
  const t = e.target.closest("[data-open],[data-close],[data-toggle],[data-scroll],[data-credits],[data-indextop]");
  if(!t) return;
  if(t.dataset.open){ open(t.dataset.open); }
  if(t.dataset.close){ close(t.dataset.close); }
  if(t.dataset.toggle){
    const item=t.closest(".navitem");
    setNavOpen(item,!item.classList.contains("open"));
  }
  if(t.dataset.scroll){ e.preventDefault(); scrollToFrames(); }
  if(t.dataset.indextop !== undefined){
    e.preventDefault();
    $("#index").scrollTo({top:0,behavior:"smooth"});
  }
  if(t.dataset.credits !== undefined){
    const frame=t.closest(".frame");
    const open=!frame.classList.contains("credits-open");
    frame.classList.toggle("credits-open",open);
    t.setAttribute("aria-expanded",String(open));
    t.textContent=open?"Credits –":"Credits +";
  }
});

function setNavOpen(item,open){
  if(!item) return;
  if(open){
    document.querySelectorAll(".navitem.open").forEach(other=>{
      if(other!==item){
        other.classList.remove("open");
        const tr=other.querySelector("[data-toggle]");
        if(tr){
          tr.setAttribute("aria-expanded","false");
          const pm=tr.querySelector(".pm");
          if(pm) pm.textContent="+";
        }
      }
    });
  }
  item.classList.toggle("open",open);
  const trigger=item.querySelector("[data-toggle]");
  if(trigger){
    trigger.setAttribute("aria-expanded",String(open));
    const pm=trigger.querySelector(".pm");
    if(pm) pm.textContent=open?"−":"+";
  }
}

let v10LandingTimer=null;
function shuffledIndexes(n){
  const a=Array.from({length:n},(_,i)=>i);
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function startV10Landing(){
  stopV10Landing();
  const host=document.getElementById("stopmotion");
  if(!host) return;
  const frames=[...host.querySelectorAll(".stopmotion-frame")];
  if(!frames.length) return;
  let order=shuffledIndexes(frames.length), pos=0, last=-1;
  const show=i=>frames.forEach((f,j)=>f.classList.toggle("is-on",j===i));
  const first=order[0]; show(first); last=first; pos=1;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  v10LandingTimer=setInterval(()=>{
    if(pos>=order.length){
      order=shuffledIndexes(frames.length);
      if(order.length>1 && order[0]===last){[order[0],order[1]]=[order[1],order[0]];}
      pos=0;
    }
    const i=order[pos++]; show(i); last=i;
  },333);
}
function stopV10Landing(){if(v10LandingTimer){clearInterval(v10LandingTimer);v10LandingTimer=null;}}

function railMetrics(card){
  const track=card.querySelector('[data-rail-track]');
  const first=track?.querySelector('.thumb');
  if(!track||!first) return null;
  const cs=getComputedStyle(track);
  const gap=parseFloat(cs.gap||'0')||0;
  const step=first.getBoundingClientRect().width+gap;
  const base=Math.max(1,Math.floor(track.children.length/2));
  return {track,step,base};
}

function setRail(card,nextIndex,animate=true){
  const m=railMetrics(card);if(!m)return;
  let i=Number.isFinite(nextIndex)?nextIndex:0;
  if(i<0){
    i=m.base;
    m.track.style.transition='none';
    m.track.style.transform=`translate3d(${-i*m.step}px,0,0)`;
    m.track.getBoundingClientRect();
    i=m.base-1;
  }
  card.dataset.railIndex=String(i);
  m.track.style.transition=animate?'transform 520ms cubic-bezier(.42,0,.18,1)':'none';
  m.track.style.transform=`translate3d(${-i*m.step}px,0,0)`;
  if(i>=m.base){
    window.setTimeout(()=>{
      if(!document.contains(card))return;
      card.dataset.railIndex='0';
      m.track.style.transition='none';
      m.track.style.transform='translate3d(0,0,0)';
    },560);
  }
}

function shiftRail(card,dir=1){
  if(!card)return;
  const current=parseInt(card.dataset.railIndex||'0',10)||0;
  setRail(card,current+dir,true);
}

function initProjectShowcase(){
  stopV11ProjectShowcase();
  const cards=[...document.querySelectorAll('[data-project-card]')];
  cards.forEach(c=>setRail(c,0,false));
  if(!cards.length || matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  v11RailObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>e.target.dataset.railVisible=e.isIntersecting?'1':'0');
  },{rootMargin:'20% 0px 20% 0px',threshold:.01});
  cards.forEach(c=>v11RailObserver.observe(c));
  v11RailTimer=setInterval(()=>{
    document.querySelectorAll('[data-project-card][data-rail-visible="1"]').forEach(card=>shiftRail(card,1));
  },3000);
}

function moveProjectShowcase(dir){
  const cards=[...document.querySelectorAll('[data-project-card]')];
  if(!cards.length)return;
  const mid=innerHeight/2;
  let card=cards[0],best=Infinity;
  cards.forEach(c=>{const r=c.getBoundingClientRect();const d=Math.abs((r.top+r.bottom)/2-mid);if(d<best){best=d;card=c;}});
  shiftRail(card,dir);
}

/* small local WebAudio click: intentionally quiet and short */
let v11AudioCtx=null;
function v11ClickSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    if(!v11AudioCtx)v11AudioCtx=new AC();
    const ctx=v11AudioCtx;
    if(ctx.state==='suspended')ctx.resume();
    const o=ctx.createOscillator(),g=ctx.createGain();
    const t=ctx.currentTime;
    o.type='sine';o.frequency.setValueAtTime(1450,t);o.frequency.exponentialRampToValueAtTime(980,t+.018);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.010,t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+.022);
    o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.024);
  }catch(_e){}
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('a,button,[role="button"]'))v11ClickSound();
},true);

document.addEventListener('click',e=>{
  const prev=e.target.closest('[data-carousel-prev]');

  const next=e.target.closest('[data-carousel-next]');
  if(next){e.preventDefault();e.stopPropagation();shiftRail(next.closest('[data-project-card]'),1);return;}
});

window.addEventListener('resize',()=>{

});

function route(){

  stopV10Landing();

  closeV10Lightbox();
  let html;
  if(h==="/") html = landing();
  else if(h==="/projects") html = projectsIndex();
  else if(h.startsWith("/projects/")) html = project(h.split("/")[2]);
  else if(h==="/agencies") html = agenciesPage();
  else if(h==="/contact") html = contact();
  else if(h==="/about") html = about();
  else if(h.startsWith("/for/")) html = forPage(h.split("/")[2]);
  else if(h.startsWith("/deliver/")) html = deliver();
  else html = landing();
  $("#app").innerHTML = html;
  document.body.dataset.route = h;

  renderChrome(h);
  close("menu"); close("index"); closeAllNav();
  window.scrollTo(0,0);

  lastY=0; observe();
  if(h==="/") startV10Landing();
  if(h==="/projects") initProjectShowcase();
}

function bindV12HoverMenu(){
  const trigger=document.querySelector(".site-menu-trigger");
  const menu=document.getElementById("menu");
  if(!trigger||!menu)return;

  const show=()=>{
    clearTimeout(v12MenuTimer);
    open("menu");
    trigger.setAttribute("aria-expanded","true");
  };
  const hide=()=>{
    clearTimeout(v12MenuTimer);
    v12MenuTimer=setTimeout(()=>{
      close("menu");
      trigger.setAttribute("aria-expanded","false");
    },150);
  };

  trigger.addEventListener("mouseenter",show);
  trigger.addEventListener("mouseleave",hide);
  trigger.addEventListener("focus",show);
  menu.addEventListener("mouseenter",()=>clearTimeout(v12MenuTimer));
  menu.addEventListener("mouseleave",hide);
}

/* Slightly more perceptible than v11, still a tiny mechanical tick. */
function v11ClickSound(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!v11AudioCtx)v11AudioCtx=new AC();
    const ctx=v11AudioCtx;
    if(ctx.state==="suspended")ctx.resume();
    const t=ctx.currentTime;

    const o=ctx.createOscillator();
    const g=ctx.createGain();
    o.type="square";
    o.frequency.setValueAtTime(1650,t);
    o.frequency.exponentialRampToValueAtTime(1050,t+.014);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.012,t+.0015);
    g.gain.exponentialRampToValueAtTime(.0001,t+.018);
    o.connect(g);g.connect(ctx.destination);
    o.start(t);o.stop(t+.02);
  }catch(_e){}
}

  card.querySelectorAll('[data-rail-clone="1"]').forEach(n=>n.remove());
}

function configureRail(card){
  const viewport=card.querySelector('[data-rail-viewport]');
  const track=card.querySelector('[data-rail-track]');
  if(!viewport||!track)return false;

  clearRailClones(card);
  const originals=railOriginals(card);
  card.dataset.railIndex='0';
  track.style.transition='none';
  track.style.transform='translate3d(0,0,0)';
  track.style.width='max-content';
  track.style.justifyContent='flex-start';

  if(!originals.length){
    viewport.classList.add('is-static');
    viewport.classList.remove('is-active');
    card.dataset.railActive='0';
    return false;
  }

  const gap=parseFloat(getComputedStyle(track).gap||'0')||0;
  const available=viewport.clientWidth;
  const VISIBLE=(window.innerWidth<768)?3:4;         // 3 across on phone, 4 on desktop
  const thumbW=Math.max(1,Math.floor((available-gap*(VISIBLE-1))/VISIBLE));
  originals.forEach(el=>{el.style.flex='0 0 '+thumbW+'px';el.style.width=thumbW+'px';});

  /* James: <=VISIBLE non-hero thumbnails sit static (no motion/arrows); more animate. */
  const active=originals.length>VISIBLE;
  viewport.classList.toggle('is-active',active);
  viewport.classList.toggle('is-static',!active);
  card.dataset.railActive=active?'1':'0';

  if(!active){
    track.style.width='100%';
    track.style.justifyContent='center';
    return false;
  }

  track.style.width='max-content';
  track.style.justifyContent='flex-start';

  /* One duplicate sequence is enough for a seamless one-step loop. */
  originals.forEach(original=>{
    const clone=original.cloneNode(true);
    clone.dataset.railClone='1';
    clone.removeAttribute('data-original-thumb');
    clone.removeAttribute('data-original-index');
    clone.style.flex='0 0 '+thumbW+'px';
    clone.style.width=thumbW+'px';
    track.appendChild(clone);
  });
  return true;
}

function railMetrics(card){
  if(card?.dataset.railActive!=='1')return null;
  const track=card.querySelector('[data-rail-track]');
  const first=card.querySelector('[data-original-thumb="1"]');
  const originals=railOriginals(card);
  if(!track||!first||!originals.length)return null;
  const gap=parseFloat(getComputedStyle(track).gap||'0')||0;
  const step=first.getBoundingClientRect().width+gap;
  return {track,step,base:originals.length};
}

function setRail(card,nextIndex,animate=true){
  const m=railMetrics(card);
  if(!m)return;

  let i=Number.isFinite(nextIndex)?nextIndex:0;
  if(i<0){
    i=m.base;
    m.track.style.transition='none';
    m.track.style.transform=`translate3d(${-i*m.step}px,0,0)`;
    m.track.getBoundingClientRect();
    i=m.base-1;
  }

  card.dataset.railIndex=String(i);
  m.track.style.transition=animate?'transform 500ms cubic-bezier(.42,0,.18,1)':'none';
  m.track.style.transform=`translate3d(${-i*m.step}px,0,0)`;

  if(i>=m.base){
    window.setTimeout(()=>{
      if(!document.contains(card) || card.dataset.railActive!=='1')return;
      card.dataset.railIndex='0';
      m.track.style.transition='none';
      m.track.style.transform='translate3d(0,0,0)';
    },540);
  }
}

function shiftRail(card,dir=1){
  if(!card || card.dataset.railActive!=='1')return;
  const current=parseInt(card.dataset.railIndex||'0',10)||0;
  setRail(card,current+dir,true);
}

function initProjectShowcase(){
  stopV11ProjectShowcase();

  v11RailObserver=new IntersectionObserver(entries=>{
    entries.forEach(e=>e.target.dataset.railVisible=e.isIntersecting?'1':'0');
  },{rootMargin:'20% 0px 20% 0px',threshold:.01});
  cards.forEach(c=>v11RailObserver.observe(c));

  /* Timer exists globally but does nothing to static rails.
     Only genuine overflow rails advance one image every 3 seconds. */
  v11RailTimer=setInterval(()=>{
    document.querySelectorAll('[data-project-card][data-rail-visible="1"][data-rail-active="1"]')
      .forEach(card=>shiftRail(card,1));
  },3000);
}

/* Match the landing photograph's actual object-fit: cover geometry.
   stopmotion-frame occupies a box 1px beyond each viewport edge. */
function v15SetLandingFrame(frame){
  if(!frame)return;

  const root=document.documentElement;
  root.style.setProperty("--v15-landing-frame",`url("${frame.src}")`);

  const boxW=window.innerWidth+2;
  const boxH=window.innerHeight+2;
  const nw=frame.naturalWidth||boxW;
  const nh=frame.naturalHeight||boxH;
  const scale=Math.max(boxW/nw,boxH/nh);
  const renderedW=nw*scale;
  const renderedH=nh*scale;

  const x=-1+(boxW-renderedW)/2;
  const y=-1+(boxH-renderedH)/2;

  root.style.setProperty("--v15-bg-w",`${renderedW}px`);
  root.style.setProperty("--v15-bg-h",`${renderedH}px`);
  root.style.setProperty("--v15-bg-x",`${x}px`);
  root.style.setProperty("--v15-bg-y",`${y}px`);

  const mask=document.querySelector(".v15-logo-invert");
  if(mask){
    const maskURL=`url("${V10_LOGO}")`;
    mask.style.setProperty("--v15-logo-mask",maskURL);
  }
}

function startV10Landing(){
  stopV10Landing();
  const host=document.getElementById("stopmotion");
  if(!host)return;
  const frames=[...host.querySelectorAll(".stopmotion-frame")];
  if(!frames.length)return;

  const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
  const ready=[];               // indices whose image has fully decoded
  let shown=-1,last=-1,order=[],pos=0;
  const show=i=>{frames.forEach((f,j)=>f.classList.toggle("is-on",j===i));shown=i;last=i;};

  frames.forEach((f,i)=>{
    const add=()=>{ if(ready.indexOf(i)<0)ready.push(i);
      if(shown<0){ show(i); host.classList.add("is-ready"); } };
    /* Gate on download completion, not decode(): decode() stalls on hidden
       images. A fully downloaded JPEG decodes in ~1ms when it flips visible. */
    if(f.complete && f.naturalWidth>0){ add(); }
    else{ f.addEventListener("load",add,{once:true});
          f.addEventListener("error",()=>{},{once:true}); }
  });

  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;

  v10LandingTimer=setInterval(()=>{
    if(ready.length===0)return;                        // hold (never show a blank frame)
    if(pos>=order.length || order.length!==ready.length){
      order=shuffle(ready);
      if(order.length>1 && order[0]===last){[order[0],order[1]]=[order[1],order[0]];}
      pos=0;
    }
    let i=order[pos++];
    if(i===shown && ready.length>1){ if(pos>=order.length){order=shuffle(ready);pos=0;} i=order[pos++]; }
    show(i);
  },250);   /* CHUNK 7: 4 images per second */
}

function v15RefreshLandingGeometry(){
  if((location.hash.replace(/^#/,"")||"/")!=="/")return;
  const active=document.querySelector(".stopmotion-frame.is-on");
  if(active)v15SetLandingFrame(active);
}

/* Cleaner single mechanical tick used for BOTH hover and activation.
   Browser policy may suppress hover audio until the first user gesture. */
let v21LastTick=0;
function v11ClickSound(){
  try{
    const now=performance.now();
    if(now-v21LastTick<38)return;
    v21LastTick=now;

    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    if(!v11AudioCtx)v11AudioCtx=new AC();
    const ctx=v11AudioCtx;
    if(ctx.state==="suspended")ctx.resume();

    const t=ctx.currentTime;
    const o=ctx.createOscillator();
    const g=ctx.createGain();

    o.type="square";
    o.frequency.setValueAtTime(1320,t);
    o.frequency.exponentialRampToValueAtTime(900,t+.010);

    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.0065,t+.001);
    g.gain.exponentialRampToValueAtTime(.0001,t+.012);

    o.connect(g);
    g.connect(ctx.destination);
    o.start(t);
    o.stop(t+.014);
  }catch(_e){}
}

/* Full portfolio PDF: title page + all project images.
   Uses the same source material and export engine as project PDFs. */
async function buildFullPortfolioPDF(){
  if(!window.jspdf)return null;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:"pt",format:"a4"});
  const pageW=doc.internal.pageSize.getWidth();
  const pageH=doc.internal.pageSize.getHeight();
  const margin=42;
  doc.setFont("helvetica","bold"); doc.setFontSize(23); doc.setTextColor(0);
  doc.text("CIRO MOSTI",margin,margin+4);
  doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(115);
  doc.text("Portfolio",margin,margin+23);
  const list = PROJECTS.filter(p=>!p.locked || yeezyUnlocked());
  for(const p of list){
    doc.addPage(); doc.setTextColor(0); doc.setFont("helvetica","bold"); doc.setFontSize(18);
    doc.text(p.title,margin,margin);
    for(let fi=0; fi<p.frames.length; fi++){
      const f=p.frames[fi];
      if(fi>0)doc.addPage();
      const meta=IMGMETA[f.src];
      const im=await pdfImageData(src(f.src),1100);
      const availW=pageW-margin*2;
      const top=fi===0 ? margin+22 : margin;
      const availH=pageH-top-margin-10;
      const ratio=meta.w/meta.h;
      let w=availW,h=w/ratio;
      if(h>availH){h=availH;w=h*ratio;}
      doc.addImage(im.data,"JPEG",margin+(availW-w)/2,top,w,h);
    }
  }
  return doc;
}

function yeezyUnlocked(){ try{ return sessionStorage.getItem("ciro-yeezy-unlock")==="1"; }catch(e){ return false; } }
function tryYeezyUnlock(pw){ if(pw===YEEZY_PASSWORD){ try{ sessionStorage.setItem("ciro-yeezy-unlock","1"); }catch(e){} return true; } return false; }
function promptYeezy(after){
  const pw = window.prompt("This project is password protected.\nEnter password to view:");
  if(pw==null) return;
  if(tryYeezyUnlock(pw)){ (after||route)(); } else { alert("Incorrect password."); }
}
function yeezyGatePage(p){
  return `<main class="project-page yeezy-gate-page">
    <div class="yeezy-gate">
      <h1 class="project-title">${p.title}</h1>
      <p class="yeezy-gate-note">this project is password protected</p>
      <form data-yeezy-form autocomplete="off">
        <input type="password" name="pw" placeholder="password" autocomplete="off" autofocus>
        <button type="submit">enter</button>
      </form>
    </div>
  </main>`;
}
function yeezyLockedBlockHTML(p,index){
  const hero=p.frames[0];
  return `<section id="proj-${p.slug}" class="showcase-project${index%2?" is-alt":""}">
    <div class="showcase-project-inner">
      <div class="showcase-main">
        <div class="showcase-copy">
          <a class="showcase-title" href="#/projects/${p.slug}">${p.title}</a>
          <button class="showcase-pdf yeezy-lock" type="button" data-yeezy-unlock>password required</button>
        </div>
        <button class="showcase-hero" type="button" data-yeezy-unlock aria-label="Password protected — click to enter password">
          <img src="${src(hero.src)}" alt="">
        </button>
      </div>
    </div>
  </section>`;
}
document.addEventListener("submit",function(e){
  const f=e.target.closest("[data-yeezy-form]"); if(!f) return;
  e.preventDefault();
  const inp=f.querySelector('input[name="pw"]');
  if(tryYeezyUnlock(inp?inp.value:"")){ route(); } else { alert("Incorrect password."); if(inp){inp.value="";inp.focus();} }
});
document.addEventListener("click",function(e){
  const b=e.target.closest("[data-yeezy-unlock]"); if(!b) return;
  e.preventDefault(); e.stopPropagation();
  promptYeezy(function(){
    route();
    requestAnimationFrame(function(){
      if((location.hash.replace(/^#/,"")||"/")==="/" && typeof v24ScrollToProjects==="function") v24ScrollToProjects();
    });
  });
},true);
function loadPdfImage(pathOrData){
  return new Promise(function(resolve,reject){
    const im=new Image();
    im.onload=function(){ resolve(im); };
    im.onerror=function(){ reject(new Error("Could not load "+pathOrData)); };
    im.src=pathOrData;
  });
}
/* Downscale each photo before embedding so PDFs stay light and fast,
   especially the full-portfolio export (135 photographs). */
function pdfImageData(pathOrData,maxEdge){
  maxEdge=maxEdge||1500;
  return loadPdfImage(pathOrData).then(function(img){
    let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    const s=Math.min(1, maxEdge/Math.max(w,h));
    const cw=Math.max(1,Math.round(w*s)), ch=Math.max(1,Math.round(h*s));
    const c=document.createElement("canvas"); c.width=cw; c.height=ch;
    c.getContext("2d").drawImage(img,0,0,cw,ch);
    return {data:c.toDataURL("image/jpeg",0.82), w:cw, h:ch};
  });
}

/* ===== PROJECTS dropdown = the index: a project name scrolls to that
   project's section on the home page (navigating home first if elsewhere). ===== */
document.addEventListener("click",function(e){
  const pl=e.target.closest(".v12-project-list a"); if(!pl) return;
  e.preventDefault(); e.stopPropagation();
  const m=(pl.getAttribute("href")||"").match(/projects\/([^\/]+)/);
  const slug=m?m[1]:null; if(!slug) return;
  const go=function(){ const el=document.getElementById("proj-"+slug); if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); };
  if((location.hash.replace(/^#/,"")||"/")==="/"){ go(); }
  else { location.hash="#/"; requestAnimationFrame(function(){ setTimeout(go,140); }); }
},true);

/* ===== CHUNK 4: project-aware lightbox (prev/next arrows + arrow keys, wrap) =====
   A showcase photo carries data-lb-project + data-lb-index, so the lightbox can
   cycle THAT project's full frame list. Photos without those attributes (project
   detail pages) keep the original single-image behaviour. */
window.lbList=[]; window.lbIndex=0;
function lbRender(){
  const img=document.getElementById("v10lightboxImg"); if(!img) return;
  img.src=src(window.lbList[window.lbIndex]);
  const multi=window.lbList.length>1;
  const p=document.querySelector("[data-lb-prev]"), n=document.querySelector("[data-lb-next]");
  if(p)p.style.display=multi?"flex":"none";
  if(n)n.style.display=multi?"flex":"none";
}
function lbStep(d){ const L=window.lbList.length; if(!L) return; window.lbIndex=(window.lbIndex+d+L)%L; lbRender(); }
(function(){
  const lb=document.getElementById("v10lightbox");
  if(lb && !lb.querySelector("[data-lb-prev]")){
    const mk=(attr,txt,cls)=>{const b=document.createElement("button");b.type="button";b.className="v10-lb-arrow "+cls;b.setAttribute(attr,"");b.setAttribute("aria-label",cls==="prev"?"Previous photograph":"Next photograph");b.textContent=txt;b.style.display="none";return b;};
    lb.appendChild(mk("data-lb-prev","\u2039","prev"));
    lb.appendChild(mk("data-lb-next","\u203a","next"));
  }
})();
function lbOpenFrom(project, index){
  const proj=PROJECTS.find(x=>x.slug===project); if(!proj) return;
  window.lbList=proj.frames.map(f=>f.src);
  window.lbIndex=index||0;
  const lb=document.getElementById("v10lightbox"); if(!lb) return;
  lbRender();
  lb.classList.add("on"); lb.setAttribute("aria-hidden","false");
  document.documentElement.style.overflow="hidden";
}
document.addEventListener("click",function(e){
  const pv=e.target.closest("[data-lb-prev]"); if(pv){e.preventDefault();e.stopPropagation();lbStep(-1);return;}
  const nx=e.target.closest("[data-lb-next]"); if(nx){e.preventDefault();e.stopPropagation();lbStep(1);return;}

  /* CHUNK 4 (revised): clicking a thumbnail promotes it into the hero slot in
     place (seen large). The hero itself opens the full-screen lightbox. */
  const th=e.target.closest(".thumb[data-lb-project]");
  if(th){
    e.preventDefault(); e.stopImmediatePropagation();
    const card=th.closest("[data-project-card]"); if(!card) return;
    const heroBtn=card.querySelector(".showcase-hero"); if(!heroBtn) return;
    const heroImg=heroBtn.querySelector("img");
    if(heroImg) heroImg.src=src(th.dataset.photo);
    heroBtn.dataset.photo=th.dataset.photo;
    heroBtn.dataset.lbIndex=th.dataset.lbIndex||"0";
    heroBtn.dataset.cap=th.dataset.cap||"";
    return;
  }
  const hero=e.target.closest(".showcase-hero[data-lb-project]");
  if(hero){
    e.preventDefault(); e.stopImmediatePropagation();
    lbOpenFrom(hero.dataset.lbProject, parseInt(hero.dataset.lbIndex||"0",10)||0);
    return;
  }
},true);

/* Project detail page: small boxed "back to projects" -> home + scroll to list. */
document.addEventListener("click",function(e){
  const b=e.target.closest("[data-back-projects]"); if(!b) return;
  e.preventDefault();
  location.hash="#/";
  requestAnimationFrame(function(){ setTimeout(function(){ if(typeof v24ScrollToProjects==="function") v24ScrollToProjects(); },80); });
});
document.addEventListener("keydown",function(e){
  const lb=document.getElementById("v10lightbox"); if(!lb || !lb.classList.contains("on")) return;
  if(e.key==="ArrowLeft"){ e.preventDefault(); e.stopImmediatePropagation(); lbStep(-1); }
  else if(e.key==="ArrowRight"){ e.preventDefault(); e.stopImmediatePropagation(); lbStep(1); }
},true);
/* ===== end v29 additions ===== */

route();
requestAnimationFrame(v17UpdateMastheadState);
</script>
</body>
